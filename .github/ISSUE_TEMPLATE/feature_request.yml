name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you are trying to solve rather than the solution alone. That makes it easier to judge whether the request fits the project's offline-first, no-account design.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits it, and how often?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Rule coverage / ruleset
        - Scan pipeline (camera, OCR, barcode)
        - Verdict or safety logic
        - UI or design system
        - History or storage
        - Build, CI, or tooling
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints worth confirming
      description: TrueLabels is offline-first and does not require an account. Features that would break either need discussion first.
      options:
        - label: This feature keeps all analysis on device
          required: false
        - label: This feature does not require an account or sign-in
          required: false
        - label: This feature does not add a required outbound network call
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
